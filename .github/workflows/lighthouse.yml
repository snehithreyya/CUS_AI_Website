name: Lighthouse CI

# Quality gate: audits every page, on desktop and on emulated mobile, for performance,
# accessibility, best practices and SEO
# on every push and pull request. Runs separately from the Pages deploy so a regression
# fails a visible check without blocking a hotfix deploy.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: Lighthouse (${{ matrix.form-factor }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - form-factor: desktop
            config: lighthouserc.json
          - form-factor: mobile
            config: lighthouserc.mobile.json
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Build Tailwind CSS
        run: |
          npm ci --no-audit --no-fund
          npm run build:css

      - name: Run Lighthouse CI (thresholds in ${{ matrix.config }})
        run: npx --yes @lhci/cli@0.15.1 autorun --config=${{ matrix.config }}

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports-${{ matrix.form-factor }}
          path: .lighthouseci/
          retention-days: 14
